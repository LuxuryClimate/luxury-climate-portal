<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><div>
  <h4 class="text-md font-semibold mb-2">Step 4: Attic</h4>
  <label class="block mb-2">
    <span class="text-gray-700 text-sm">Attic Height</span>
    <input type="text" x-model="editForm.atticHeight" class="mt-1 block w-full p-2 border border-gray-300 rounded-md text-sm" @input="autoSave">
  </label>
  <label class="block mb-2">
    <span class="text-gray-700 text-sm">Ventilation Fan Location</span>
    <select x-model="editForm.ventilationFanLocation" class="mt-1 block w-full p-2 border border-gray-300 rounded-md text-sm" @input="autoSave">
      <template x-for="option in formOptions.ventilationFanLocations" :key="option.value">
        <option :value="option.value" x-text="option.label"></option>
      </template>
    </select>
  </label>
  <template x-if="editForm.ventilationFanLocation !== 'none'">
    <label class="block mb-2">
      <span class="text-gray-700 text-sm">Ventilation Fan Type (Select all that apply)</span>
      <div class="mt-1">
        <template x-for="option in formOptions.ventilationFanTypes" :key="option.value">
          <label class="block">
            <input type="checkbox" x-model="editForm.ventilationFanTypes" :value="option.value" class="mr-2" @input="autoSave">
            <span class="text-sm" x-text="option.label"></span>
          </label>
        </template>
      </div>
    </label>
    <template x-if="editForm.ventilationFanTypes.includes('other')">
      <label class="block mb-2">
        <span class="text-gray-700 text-sm">Other Ventilation Fan Type (Specify)</span>
        <input type="text" x-model="editForm.otherVentilationFanType" class="mt-1 block w-full p-2 border border-gray-300 rounded-md text-sm" @input="autoSave">
      </label>
    </template>
  </template>
  <div class="flex justify-between">
    <button @click="previousStep" class="bg-gray-500 text-white p-2 rounded-md hover:bg-gray-600 text-sm">Previous</button>
    <button @click="nextStep" class="bg-green-600 text-white p-2 rounded-md hover:bg-green-700 text-sm">Next</button>
  </div>
</div>
