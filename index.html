<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

                    <option value="Completed Estimate">Completed Estimate</option>
                    <option value="Approved">Approved</option>
                    <option value="Completed">Completed</option>
                    <option value="Invoice Sent">Invoice Sent</option>
                    <option value="Invoice Paid">Invoice Paid</option>
                  </select>
                </label>
                <div style="display: flex; justify-content: space-between;">
                  <button @click="editStep = 5" class="gray-btn">Previous</button>
                  <button @click="saveEstimate" class="blue-btn">Save</button>
                </div>
              </div>
            </template>
          </div>
          <button @click="showEditModal = false" class="red-btn" style="width: 100%;">Close</button>
        </div>
      </div>
    </template>

    <!-- Material Order Generator Section -->
    <template x-if="page === 'orders'">
      <div class="material-order section">
        <h2>Material Order Generator</h2>
        <div style="margin-top: 20px;">
          <label>
            <span>Job Number (PO)</span>
            <input type="text" x-model="order.jobNumber">
          </label>
          <label>
            <span>Address</span>
            <input type="text" x-model="order.address">
          </label>
          <label>
            <span>Installation Date(s)</span>
            <input type="text" x-model="order.installDates">
          </label>
          <label>
            <span>Site Contact Name</span>
            <input type="text" x-model="order.siteName">
          </label>
          <label>
            <span>Site Contact Phone</span>
            <input type="text" x-model="order.sitePhone">
          </label>
          <label>
            <span>Shipping Date</span>
            <input type="text" x-model="order.shippingDate">
          </label>
          <label>
            <span>Delivery Details</span>
            <input type="text" x-model="order.deliveryDetails">
          </label>
          <label>
            <span>Delivery Contact Name</span>
            <input type="text" x-model="order.deliveryName">
          </label>
          <label>
            <span>Delivery Contact Phone</span>
            <input type="text" x-model="order.deliveryPhone">
          </label>
          <label>
            <span>Project Account</span>
            <select x-model="order.projectAccount">
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </label>
          <label>
            <span>Materials and Quantities</span>
            <div>
              <template x-for="(item, index) in order.items" :key="index">
                <div class="pricebook-item">
                  <select x-model="item.uuid" @change="updateItemVendor(index)">
                    <option value="">Select an item</option>
                    <template x-for="pricebookItem in pricebook" :key="pricebookItem.uuid">
                      <option :value="pricebookItem.uuid" x-text="pricebookItem.name + ' (' + pricebookItem.type + ')'"></option>
                    </template>
                  </select>
                  <input type="number" x-model.number="item.quantity" min="1" placeholder="Qty">
                  <button @click="removeItem(index)" class="red-btn">X</button>
                </div>
              </template>
              <button @click="addItem" class="blue-btn" style="margin-top: 10px;">Add Item</button>
            </div>
          </label>
          <button @click="submitOrder" class="blue-btn" style="width: 100%;">Generate and Send Order</button>
        </div>
      </div>
    </template>
  </main>

  <!-- Navigation -->
  <script>
    async function initNav() {
      document.getElementById('nav-placeholder').innerHTML = `
        <nav>
          <div class="nav-logo">
            <img src="luxury-climate-logo-dark.svg" alt="Luxury Climate Logo">
            <span>Luxury Climate HVAC Portal</span>
          </div>
          <div class="nav-buttons">
            <button x-on:click="page = 'estimate'">Estimate Manager</button>
            <button x-on:click="page = 'orders'">Material Orders</button>
          </div>
        </nav>
      `;
    }
  </script>
</body>
</html>
